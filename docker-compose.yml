services:
  redis:
    image: redis:7-alpine
    container_name: seenad_redis
    restart: unless-stopped
    # Not published to host — internal Docker network only
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--protected-mode",
        "yes",
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16
    container_name: seenad_db
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Kept public for remote project access (credentials unchanged)
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/migrations:/var/www/seenad/postgres/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seenad_db -d seenad_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seenad_backend
    restart: unless-stopped
    working_dir: /app
    extra_hosts:
      - "bama.ir:185.166.104.4"
      - "www.bama.ir:185.166.104.4"
      - "karnameh.com:185.166.104.4"
      - "www.karnameh.com:185.166.104.4"
      - "hamrah-mechanic.com:185.143.232.253"
      - "www.hamrah-mechanic.com:185.143.232.253"
    dns:
      - 8.8.8.8
      - 4.2.2.4
    volumes:
      - ./:/app
    env_file:
      - .env
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seenad_worker
    restart: unless-stopped
    working_dir: /app
    extra_hosts:
      - "bama.ir:185.166.104.4"
      - "www.bama.ir:185.166.104.4"
      - "karnameh.com:185.166.104.4"
      - "www.karnameh.com:185.166.104.4"
      - "hamrah-mechanic.com:185.143.232.253"
      - "www.hamrah-mechanic.com:185.143.232.253"
    dns:
      - 8.8.8.8
      - 4.2.2.4
    volumes:
      - ./:/app
    env_file:
      - .env
    command: celery -A app.celery_app:celery_app worker --concurrency=2 --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  benchmark_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seenad_benchmark_worker
    restart: unless-stopped
    working_dir: /app
    profiles:
      - benchmark
    # SB-01: deprecated scraper benchmark writer — do not enable in production.
    # Requires BENCHMARK_DATABASE_URL and BENCHMARK_LEGACY_WRITER_COMPAT_VERIFIED=1 after schema audit.
    extra_hosts:
      - "bama.ir:185.166.104.4"
      - "www.bama.ir:185.166.104.4"
      - "hamrah-mechanic.com:185.143.232.253"
      - "www.hamrah-mechanic.com:185.143.232.253"
    dns:
      - 8.8.8.8
      - 4.2.2.4
    volumes:
      - ./:/app
    env_file:
      - .env
    command:
      [
        "celery",
        "-A",
        "app.celery_app:celery_app",
        "worker",
        "--concurrency=1",
        "--loglevel=info",
        "-Q",
        "scheduled_tasks",
      ]
    environment:
      DATABASE_URL: ${BENCHMARK_DATABASE_URL}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PYTHONPATH: /app
      BENCHMARK_ENABLED: "0"
    depends_on:
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seenad_beat
    restart: unless-stopped
    working_dir: /app
    extra_hosts:
      - "bama.ir:185.166.104.4"
      - "www.bama.ir:185.166.104.4"
      - "hamrah-mechanic.com:185.143.232.253"
      - "www.hamrah-mechanic.com:185.143.232.253"
    dns:
      - 8.8.8.8
      - 4.2.2.4
    volumes:
      - ./:/app
      - celerybeat_schedule:/tmp/celerybeat
    env_file:
      - .env
    command:
      [
        "celery",
        "-A",
        "app.celery_app:celery_app",
        "beat",
        "--loglevel=info",
        "--schedule=/tmp/celerybeat/celerybeat-schedule",
      ]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PYTHONPATH: /app
      BAMA_INGESTION_INTERVAL_SECONDS: "30"
      BAMA_INGESTION_BEAT_ENABLED: "1"
      BAMA_DISCOVERY_INTERVAL_SECONDS: "300"
      BAMA_DISCOVERY_BEAT_ENABLED: "1"
      HM_INGESTION_BEAT_ENABLED: "1"
      HM_INGESTION_INTERVAL_SECONDS: "30"
      KN_INGESTION_BEAT_ENABLED: "1"
      KN_INGESTION_INTERVAL_SECONDS: "30"
      LISTING_FEEDER_BEAT_ENABLED: "1"
      LISTING_FEEDER_INTERVAL_SECONDS: "300"
      MAPPING_PIPELINE_BEAT_ENABLED: "0"
      USD_IRR_RATE_BEAT_ENABLED: "1"
      USD_IRR_RATE_BEAT_HOURS_UTC: "7,14"
      USD_IRR_RATE_BEAT_MINUTE_UTC: "30"
      SELL_NEWS_BEAT_ENABLED: "1"
      SELL_NEWS_BEAT_HOURS_UTC: "7,12"
      SELL_NEWS_BEAT_MINUTE_UTC: "30"
      BAMA_ZERO_PRICE_BEAT_ENABLED: "1"
      BAMA_ZERO_PRICE_BEAT_HOURS_UTC: "7,9,12"
      BAMA_ZERO_PRICE_BEAT_MINUTE_UTC: "15"
      IRANJIB_ZERO_PRICE_BEAT_ENABLED: "1"
      IRANJIB_ZERO_PRICE_BEAT_HOURS_UTC: "7,9,12"
      IRANJIB_ZERO_PRICE_BEAT_MINUTE_UTC: "20"
      # SB-01: legacy scraper benchmark beat off by default (seenad-main owns benchmark writes).
      ZERO_PRICE_BENCHMARK_BEAT_ENABLED: "0"
      ZERO_PRICE_BENCHMARK_BEAT_HOURS_UTC: "6,12"
      ZERO_PRICE_BENCHMARK_BEAT_MINUTE_UTC: "15"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  # Keep existing production volumes (do not recreate empty ones)
  postgres_data:
    external: true
    name: project_postgres_data
  celerybeat_schedule:
    external: true
    name: project_celerybeat_schedule
  redis_data:
    external: true
    name: cc382202853ddc03aaa07ce8cf2277f80a90ba125a7e3c79a0ec23660bbf64c9
